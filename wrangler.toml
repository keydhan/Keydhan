name = "keydhan-v30-staging"
main = "worker.js"
compatibility_date = "2026-09-29"

# Before deploying, create a KV namespace and replace this placeholder with its ID.
[[kv_namespaces]]
binding = "KEYDHAN_DB"
id = "849a5554c02641ba8bed133ae34622f0"

[[send_email]]
name = "EMAIL"
destination_address = "hello@keydhan.com"
allowed_sender_addresses = ["hello@keydhan.com"]

# Cashfree payment ledger — isolated sandbox database.
[[d1_databases]]
binding = "KEYDHAN_PAYMENTS_DB"
database_name = "keydhan-payments-sandbox"
database_id = "aff93205-d772-4b5e-a09f-80dd0824e643"
migrations_dir = "migrations"
