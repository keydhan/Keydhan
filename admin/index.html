
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KeyDhan™ Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Poppins,sans-serif;
background:#020814;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%);
top:-120px;
right:-120px;
}

body::after{
content:"";
position:absolute;
width:450px;
height:450px;
background:radial-gradient(circle,rgba(212,175,55,.10),transparent 70%);
bottom:-120px;
left:-120px;
}

.login-box{

position:relative;
z-index:2;

width:100%;
max-width:420px;

background:rgba(7,19,35,.95);
backdrop-filter:blur(20px);

padding:35px;

border-radius:26px;

border:1px solid rgba(212,175,55,.20);

box-shadow:0 30px 60px rgba(0,0,0,.45);

}

.logo{

text-align:center;

font-size:34px;
font-weight:800;

margin-bottom:10px;

}

.logo span{
color:#D4AF37;
}

.logo sup{
color:#D4AF37;
font-size:12px;
}

.subtitle{

text-align:center;
color:#9ca3af;

margin-bottom:28px;

font-size:15px;

}

.qr-icon{

width:90px;
height:90px;

margin:0 auto 20px;

display:flex;
justify-content:center;
align-items:center;

font-size:46px;

border-radius:22px;

background:radial-gradient(circle,#F8E58C,#D4AF37);

color:#111;

box-shadow:0 0 30px rgba(212,175,55,.35);

animation:floatIcon 3s ease-in-out infinite;

}

@keyframes floatIcon{

50%{
transform:translateY(-6px);
}

}

label{

display:block;

margin:14px 0 8px;

font-size:14px;
font-weight:600;

}

input{

width:100%;

padding:14px;

border-radius:14px;

border:1px solid #334;

background:#0b1627;

color:white;

font-size:16px;

outline:none;

transition:.25s;

}

input:focus{

border-color:#D4AF37;

box-shadow:0 0 15px rgba(212,175,55,.20);

}

button{

width:100%;

padding:15px;

margin-top:22px;

background:#D4AF37;

color:#111;

font-size:17px;

font-weight:700;

border:none;

border-radius:14px;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:0 10px 30px rgba(212,175,55,.35);

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:14px;

font-size:14px;

}

.row a{

color:#D4AF37;

text-decoration:none;

}

.checkbox{

display:flex;

align-items:center;

gap:8px;

margin-top:16px;

font-size:14px;

color:#cbd5e1;

}

.checkbox input{

width:auto;

}

.security{

margin-top:24px;

padding:15px;

border-radius:14px;

background:#0b1627;

border:1px solid rgba(212,175,55,.15);

font-size:13px;

color:#9ca3af;

line-height:1.7;

}

.badges{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-top:18px;

}

.badge{

padding:8px 12px;

border-radius:999px;

background:#0b1627;

border:1px solid rgba(212,175,55,.15);

font-size:12px;

color:#D4AF37;

}

@media(max-width:480px){

.login-box{

padding:26px;

}

.logo{

font-size:28px;

}

.qr-icon{

width:80px;
height:80px;
font-size:40px;

}

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
Key<span>Dhan</span><sup>™</sup>
</div>

<div class="subtitle">
Secure Admin Portal
</div>

<div class="qr-icon">
🔐
</div>

<label>Username</label>

<input
type="text"
placeholder="Enter username">

<label>Password</label>

<input
type="password"
placeholder="Enter password">

<label>Google Authenticator Code</label>

<input
type="text"
maxlength="6"
placeholder="6-digit code">

<div class="checkbox">

<input type="checkbox">

Remember this device for 30 days

</div>

<button onclick="login()">
Secure Login
</button>

<div class="row">

<a href="#">Forgot Password?</a>

<a href="/">Back to Website</a>

</div>

<div class="badges">

<div class="badge">2FA Ready</div>

<div class="badge">Cloudflare</div>

<div class="badge">HTTPS</div>

</div>

<div class="security">

<strong>Security Status</strong>

<br><br>

• Google Authenticator (TOTP) Ready

<br>

• Session Timeout: 15 Minutes

<br>

• Backup Codes Supported

<br>

• Cloudflare Access Compatible

<br>

• Future Face ID Support

</div>

</div>

<script>

function login(){

alert(
"Demo Login Screen.\n\nV20.2 me Google Authenticator + Cloudflare Access ke saath real secure login enable hoga."
);

}

</script>

</body>
</html>
