<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KeyDhan™ Secure Admin</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#07111f;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.card{
width:420px;
background:#0f1b2b;
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:42px;
text-align:center;
box-shadow:0 0 35px rgba(255,196,0,.18);
}

.logo{
font-size:52px;
font-weight:900;
color:#FFC400;
margin-bottom:12px;
}

.subtitle{
color:#cbd5e1;
margin-bottom:30px;
font-size:18px;
}

.loader{
width:52px;
height:52px;
margin:0 auto 28px;
border:5px solid rgba(255,255,255,.15);
border-top:5px solid #FFC400;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.status{
color:#FFC400;
font-weight:bold;
margin-bottom:10px;
}

.note{
color:#94a3b8;
font-size:14px;
line-height:1.6;
}
</style>

<script>
// Redirect to Cloudflare-protected dashboard
window.location.replace("/admin/dashboard.html");
</script>

</head>

<body>

<div class="card">

<div class="logo">KeyDhan™</div>

<div class="subtitle">
Enterprise Secure Admin Portal
</div>

<div class="loader"></div>

<div class="status">
Verifying Secure Access...
</div>

<div class="note">
Cloudflare Access + Google Authenticator (TOTP)<br>
protect this admin portal.
</div>

</div>

</body>
</html>
