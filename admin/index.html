<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDhan™ Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#020814,#071a34);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#fff;
}
:root{--gold:#D4AF37;}
.card{
width:100%;
max-width:430px;
background:rgba(8,20,40,.96);
border:1px solid rgba(212,175,55,.25);
border-radius:24px;
padding:34px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
backdrop-filter:blur(12px);
}
.logo{
font-size:46px;
font-weight:800;
text-align:center;
margin-bottom:8px;
}
.logo span{color:var(--gold)}
.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:28px;
}
.icon{
width:96px;
height:96px;
margin:0 auto 24px;
background:linear-gradient(135deg,#FFD84D,#D4AF37);
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
font-size:46px;
}
label{
display:block;
margin:14px 0 8px;
font-weight:600;
}
input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid rgba(255,255,255,.15);
background:#0b1627;
color:#fff;
font-size:16px;
outline:none;
}
input:focus{
border-color:var(--gold);
box-shadow:0 0 0 3px rgba(212,175,55,.15);
}
button{
width:100%;
padding:15px;
margin-top:22px;
border:none;
border-radius:14px;
background:var(--gold);
color:#111;
font-size:18px;
font-weight:700;
cursor:pointer;
}
button:hover{filter:brightness(1.05)}
.links{
margin-top:22px;
display:flex;
justify-content:space-between;
font-size:14px;
}
.links a{
color:#cbd5e1;
text-decoration:none;
}
.footer{
text-align:center;
margin-top:18px;
font-size:12px;
color:#94a3b8;
}
.badge{
margin-top:18px;
padding:10px;
border-radius:12px;
background:rgba(212,175,55,.08);
border:1px solid rgba(212,175,55,.15);
font-size:13px;
color:#dbeafe;
text-align:center;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">Key<span>Dhan™</span></div>
<div class="subtitle">Enterprise Secure Admin Portal</div>

<div class="icon">🔐</div>

<form id="loginForm">

<label>Email</label>
<input
id="email"
type="email"
placeholder="Enter admin email"
required>

<label>Password</label>
<input
id="password"
type="password"
placeholder="Enter password"
required>

<button type="submit">Secure Login</button>

</form>

<div class="badge">
Cloudflare Access + Google Authenticator (TOTP) protects this admin portal.
</div>

<div class="links">
<a href="/">← Back to Website</a>
<a href="https://www.cloudflare.com">Cloudflare</a>
</div>

<div class="footer">
KeyDhan™ Enterprise Security • V20.5
</div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

if(!email || !password){
alert("Please enter email and password.");
return;
}

/*
Cloudflare Access already verifies:
✓ Allowed Email
✓ Google Authenticator (TOTP)
✓ Identity
*/

window.location.href="dashboard.html";

});
</script>

</body>
</html>
