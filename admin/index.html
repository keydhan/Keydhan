<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDhan™ Secure Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#020814,#071323);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

:root{--gold:#D4AF37}

.card{
width:100%;
max-width:420px;
background:rgba(7,19,35,.95);
border:1px solid rgba(212,175,55,.2);
border-radius:28px;
padding:35px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
backdrop-filter:blur(14px);
}

.logo{
text-align:center;
font-size:42px;
font-weight:800;
}

.logo span{color:var(--gold)}

.subtitle{
text-align:center;
color:#9ca3af;
margin-top:8px;
margin-bottom:25px;
}

.lock{
width:95px;
height:95px;
margin:0 auto 25px;
background:linear-gradient(135deg,#F8E58C,#D4AF37);
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
font-size:46px;
color:#111;
}

label{
display:block;
margin:14px 0 8px;
font-weight:600;
}

input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid #334;
background:#0b1627;
color:white;
font-size:16px;
outline:none;
transition:.25s;
}

input:focus{
border-color:var(--gold);
box-shadow:0 0 0 3px rgba(212,175,55,.18);
}

.remember{
display:flex;
align-items:center;
gap:10px;
margin:18px 0;
font-size:14px;
color:#cbd5e1;
}

.remember input{
width:auto;
accent-color:var(--gold);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:999px;
background:linear-gradient(135deg,#F8E58C,#D4AF37);
color:#111;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 12px 28px rgba(212,175,55,.28);
}

.links{
display:flex;
justify-content:space-between;
margin-top:18px;
font-size:14px;
}

.links a{
color:#9ca3af;
text-decoration:none;
}

.links a:hover{
color:var(--gold);
}

.note{
margin-top:22px;
text-align:center;
font-size:12px;
color:#64748b;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
Key<span>Dhan</span><sup style="font-size:12px;color:#D4AF37;">™</sup>
</div>

<div class="subtitle">Secure Admin Portal</div>

<div class="lock">🔐</div>

<form onsubmit="login(event)">

<label>Username</label>
<input id="username" type="email" placeholder="Enter username" required>

<label>Password</label>
<input id="password" type="password" placeholder="Enter password" required>

<label>Google Authenticator Code</label>
<input id="otp" type="text" maxlength="6" placeholder="6-digit code" required>

<label class="remember">
<input type="checkbox">
Remember this device for 30 days
</label>

<button type="submit">Secure Login</button>

</form>

<div class="links">
<a href="#">Forgot Password?</a>
<a href="../index.html">Back to Website</a>
</div>

<div class="note">
Protected by KeyDhan™ Enterprise Security
</div>

</div>

<script>
async function login(e){

e.preventDefault();

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value.trim();
const otp=document.getElementById("otp").value.trim();

// Username
if(username!=="hello@keydhan.com"){
alert("Invalid Username");
return;
}

// Password
if(password!=="#$Bharat@2018"){
alert("Invalid Password");
return;
}

// OTP format check
if(!/^\\d{6}$/.test(otp)){
alert("Enter a valid 6-digit Google Authenticator code");
return;
}

/*
REAL AUTHENTICATOR:
Cloudflare Zero Trust / Worker backend yahan OTP verify karega.
Static HTML me real TOTP verify nahi hota.
*/

window.location.href="dashboard.html";

}
</script>

</body>
</html>
