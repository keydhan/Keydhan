<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyDhan™ Secure Admin</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#0b1220;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }
    .box{
      background:#111827;
      padding:40px;
      border-radius:18px;
      width:420px;
      box-shadow:0 0 30px rgba(255,196,0,.25);
    }
    h1{
      color:#FFC400;
      margin-bottom:10px;
      font-size:42px;
    }
    p{
      color:#cbd5e1;
      margin:18px 0;
    }
    .loader{
      width:44px;
      height:44px;
      border:4px solid rgba(255,255,255,.15);
      border-top:4px solid #FFC400;
      border-radius:50%;
      margin:25px auto;
      animation:spin 1s linear infinite;
    }
    @keyframes spin{
      to{transform:rotate(360deg)}
    }
  </style>

  <script>
    // Direct protected page
    window.location.replace("/admin/dashboard.html");
  </script>
</head>
<body>
  <div class="box">
    <h1>KeyDhan™</h1>
    <p>Enterprise Secure Admin Portal</p>
    <div class="loader"></div>
    <p>Redirecting to Cloudflare Protected Dashboard...</p>
  </div>
</body>
</html>
