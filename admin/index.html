<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KeyDhan™ Secure Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:#020814;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
:root{--gold:#D4AF37}
body:before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at top,rgba(212,175,55,.18),transparent 40%);
pointer-events:none;
}
.card{
width:430px;
max-width:92%;
background:#071323;
border:1px solid rgba(212,175,55,.25);
border-radius:28px;
padding:36px;
box-shadow:0 20px 50px rgba(0,0,0,.45);
}
.logo{
font-size:40px;
font-weight:800;
text-align:center;
margin-bottom:8px;
}
.logo span{color:var(--gold)}
.subtitle{
text-align:center;
color:#9fb3d9;
margin-bottom:28px;
}
.lock{
font-size:68px;
text-align:center;
margin-bottom:18px;
}
label{
display:block;
margin:16px 0 8px;
font-weight:600;
}
input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid #32435c;
background:#0b1627;
color:#fff;
font-size:16px;
}
input:focus{
outline:none;
border-color:var(--gold);
box-shadow:0 0 0 3px rgba(212,175,55,.15);
}
button{
width:100%;
padding:15px;
margin-top:22px;
border:none;
border-radius:14px;
background:var(--gold);
color:#111;
font-size:17px;
font-weight:700;
cursor:pointer;
}
button:hover{transform:translateY(-2px)}
.info{
margin-top:18px;
padding:14px;
background:#0b1627;
border-radius:12px;
font-size:13px;
color:#b8c2d1;
line-height:1.6;
}
.links{
display:flex;
justify-content:space-between;
margin-top:18px;
font-size:14px;
}
.links a{
color:#9fb3d9;
text-decoration:none;
}
.footer{
text-align:center;
margin-top:24px;
font-size:12px;
color:#6b7280;
}
.loader{
display:none;
width:18px;
height:18px;
border:3px solid rgba(255,255,255,.3);
border-top-color:#111;
border-radius:50%;
animation:spin .8s linear infinite;
vertical-align:middle;
margin-right:8px;
}
@keyframes spin{
to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="card">

<div class="logo">Key<span>Dhan™</span></div>
<div class="subtitle">Enterprise Secure Admin Portal</div>

<div class="lock">🔐</div>

<form onsubmit="login(event)">

<label>Email</label>
<input id="email" type="email" placeholder="Enter admin email" autocomplete="username" required>

<label>Password</label>
<input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>

<button type="submit" id="loginBtn">
<span class="loader" id="loader"></span>
Secure Login
</button>

</form>

<div class="info">
Cloudflare Access + Google Authenticator (TOTP) protects this admin portal.
</div>

<div class="links">
<a href="/">← Back to Website</a>
<a href="https://dash.cloudflare.com" target="_blank">Cloudflare</a>
</div>

<div class="footer">
KeyDhan™ Enterprise Security • V20.3
</div>

</div>

<script>
function login(e){
e.preventDefault();

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value.trim();

if(!email||!password){
alert("Please enter email and password.");
return;
}

const btn=document.getElementById("loginBtn");
const loader=document.getElementById("loader");

btn.disabled=true;
loader.style.display="inline-block";
btn.innerHTML='<span class="loader" style="display:inline-block"></span> Verifying...';

// Cloudflare Access already authentication handle karta hai.
// Local validation intentionally nahi hai.
setTimeout(()=>{
window.location.href="/admin/dashboard.html";
},900);
}
</script>

</body>
</html>
