<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDhan™ Secure Admin Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#06142b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.card{
width:100%;
max-width:420px;
background:#0d1f3d;
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:30px;
box-shadow:0 25px 60px rgba(0,0,0,.45);
}
.logo{
font-size:52px;
font-weight:900;
text-align:center;
margin-bottom:6px;
}
.logo span:first-child{color:#fff}
.logo span:last-child{color:#f7c62f}
.sub{
text-align:center;
color:#d6dbe7;
margin-bottom:28px;
font-size:18px;
}
.lock{
font-size:64px;
text-align:center;
margin-bottom:20px;
}
label{
display:block;
color:#fff;
margin:12px 0 6px;
font-weight:700;
}
input{
width:100%;
padding:16px;
border-radius:14px;
border:1px solid rgba(255,255,255,.2);
background:#11284b;
color:#fff;
font-size:16px;
}
button{
width:100%;
margin-top:20px;
padding:16px;
border:none;
border-radius:14px;
background:#f7c62f;
font-size:20px;
font-weight:800;
cursor:pointer;
}
#msg{
margin-top:14px;
padding:12px;
border-radius:12px;
text-align:center;
display:none;
font-weight:700;
}
.ok{background:#1b5e20;color:#fff}
.err{background:#7f1d1d;color:#fff}
.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#d6dbe7;
}
.footer a{
color:#fff;
text-decoration:none;
}
</style>
</head>
<body>

<div class="card">

<div class="logo"><span>Key</span><span>Dhan™</span></div>
<div class="sub">Enterprise Secure Admin Portal</div>

<div class="lock">🔐</div>

<form id="loginForm">

<label>Email</label>
<input id="email" type="email" value="keydhan2@gmail.com" required>

<label>Password</label>
<input id="password" type="password" required>

<button type="submit">Secure Login</button>

<div id="msg"></div>

</form>

<div class="footer">
Cloudflare Access + Google Authenticator (TOTP) protects this admin portal.
<br><br>
<a href="/">← Back to Website</a>
</div>

</div>

<script>
const API="https://api.keydhan.com";

const form=document.getElementById("loginForm");
const msg=document.getElementById("msg");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

msg.style.display="block";
msg.className="";
msg.innerText="Verifying...";

try{

const r=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email.value.trim(),
password:password.value
})
});

const data=await r.json();

if(data.success){

msg.className="ok";
msg.innerText="Verified. Redirecting...";

setTimeout(()=>{
window.location.href="/admin/dashboard";
},800);

}else{

msg.className="err";
msg.innerText="Invalid email or password.";

}

}catch(err){

msg.className="err";
msg.innerText="Server connection failed.";

}

});
</script>

</body>
</html>
