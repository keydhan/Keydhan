<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDhan™ Secure Admin Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}
.card{
width:390px;
background:rgba(15,23,42,.82);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.12);
border-radius:24px;
padding:34px;
box-shadow:0 25px 60px rgba(0,0,0,.45);
}
.logo{
font-size:54px;
font-weight:800;
text-align:center;
margin-bottom:6px;
}
.logo span{color:#facc15}
.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:22px;
}
.icon{
font-size:72px;
text-align:center;
margin-bottom:18px;
}
label{
display:block;
margin:12px 0 6px;
font-weight:700;
}
input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid rgba(255,255,255,.18);
background:rgba(255,255,255,.06);
color:white;
font-size:16px;
outline:none;
}
input::placeholder{color:#94a3b8}
button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:14px;
background:#facc15;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
}
button:hover{
transform:translateY(-1px);
background:#fde047;
}
.info{
margin-top:18px;
font-size:14px;
color:#cbd5e1;
line-height:1.5;
}
.footer{
margin-top:22px;
display:flex;
justify-content:space-between;
font-size:14px;
}
.footer a{
color:#cbd5e1;
text-decoration:none;
}
.version{
margin-top:16px;
text-align:center;
font-size:13px;
color:#64748b;
}
#error{
display:none;
margin-top:12px;
padding:10px;
border-radius:10px;
background:rgba(220,38,38,.18);
color:#fecaca;
font-size:14px;
text-align:center;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">Key<span>Dhan™</span></div>
<div class="subtitle">Enterprise Secure Admin Portal</div>

<div class="icon">🔐</div>

<form id="loginForm">

<label>Email</label>
<input type="email" id="email" placeholder="Enter admin email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter password" required>

<button type="submit">Secure Login</button>

<div id="error"></div>

</form>

<div class="info">
Cloudflare Access + Google Authenticator (TOTP) protects this admin portal.
</div>

<div class="footer">
<a href="/">← Back to Website</a>
<span>Cloudflare</span>
</div>

<div class="version">
KeyDhan™ Enterprise Security • V22
</div>

</div>

<script>
const form=document.getElementById("loginForm");
const errorBox=document.getElementById("error");

form.addEventListener("submit",async(e)=>{
e.preventDefault();

errorBox.style.display="none";

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

const res=await fetch("https://api.keydhan.com",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
});

const data=await res.json();

if(data.success){

window.location.href="/cdn-cgi/access/login?redirect_url=https://keydhan.com/admin/";

}else{

errorBox.innerText="Invalid Email or Password";
errorBox.style.display="block";

}

}catch(err){

errorBox.innerText="Server connection failed";
errorBox.style.display="block";

}

});
</script>

</body>
</html>
