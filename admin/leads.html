<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Customer Leads | KeyDhan Admin</title><link rel="stylesheet" href="/admin/assets/style.css?v=20261028-leads-assets-v33"></head><body><div class="layout"><aside class="side"><div class="side-head"><div class="brand">KeyDhan™</div><button class="mobile-nav-toggle" type="button" aria-controls="adminNav" aria-expanded="false"><span class="menu-icon" aria-hidden="true">☰</span><span class="menu-label">Menu</span></button></div><nav class="nav" id="adminNav"><a href="/admin/dashboard.html">Dashboard</a><a href="/admin/properties.html">Properties</a><a href="/admin/leads.html" aria-current="page">Leads</a><a href="/admin/loan-offers.html">Loan Offers</a><a href="/admin/content.html">Page Content</a><a href="/admin/knowledge.html">Knowledge Articles</a><a href="/admin/analytics.html">Analytics</a><a href="/admin/settings.html">Settings</a><a href="/admin/settings.html#footerManagement">Footer Management</a><a href="https://keydhan.com/">View Website ↗</a></nav></aside><main class="main"><div class="top"><div><h1>Customer Leads</h1><small>KeyDhan CMS · V30</small></div><button class="alt" id="apiKeyButton" type="button">Set Admin API Key</button></div><div class="notice" id="notice">Set the Admin API key configured in Cloudflare Worker.</div><section class="panel leads-panel"><h2>Enquiries</h2><div class="lead-filters"><input id="search" placeholder="Search name, phone, email" aria-label="Search leads"><select id="dateFilter" aria-label="Filter by date"><option value="all">All time</option><option value="yesterday">Yesterday</option><option value="week">Last 7 days</option><option value="month">Last month</option><option value="year">Last year</option><option value="custom">Custom date range</option></select><select id="interestFilter" aria-label="Filter by enquiry type"><option value="all">All enquiry types</option><option>Home Loan</option><option>Business Loan</option><option>Loan Against Property</option><option>Real Estate</option></select><select id="statusFilter" aria-label="Filter by status"><option value="all">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="closed">Closed</option><option value="spam">Spam</option></select><div id="customDates" class="custom-dates hidden"><label>From <input id="dateFrom" type="date"></label><label>To <input id="dateTo" type="date"></label></div><div class="filter-actions"><span id="resultCount" aria-live="polite">Loading leads…</span><button id="clearFilters" class="alt" type="button">Clear filters</button><button id="reload" type="button">Refresh</button></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Name</th><th>Phone / Email</th><th>Interest</th><th>Message</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>
(function(){
  var tried=[];
  function fail(message){
    var count=document.getElementById('resultCount'),rows=document.getElementById('rows'),notice=document.getElementById('notice');
    if(count)count.textContent='Leads script failed to start';
    if(rows)rows.innerHTML='<tr><td colspan="7" class="empty">'+message+'</td></tr>';
    if(notice){notice.textContent=message;notice.classList.remove('hidden');}
  }
  function loadScript(paths, name, done){
    var index=0;
    function attempt(){
      if(index>=paths.length){fail('Could not start '+name+'. Tried: '+tried.join(', ')+'. Please reload and retry.');return;}
      var path=paths[index++];tried.push(path);
      var script=document.createElement('script');
      script.src=path+'?v=20261028-leads-loader-v35';
      script.onload=function(){
        if(name==='Customer Leads' && typeof window.reloadAdminData!=='function'){
          script.remove();
          attempt();
          return;
        }
        if(done)done();
      };
      script.onerror=function(){script.remove();attempt();};
      document.body.appendChild(script);
    }
    attempt();
  }
  window.addEventListener('error',function(event){
    if(event.filename && /leads\.js/.test(event.filename)){
      fail('Customer Leads JavaScript error: '+(event.message||'script could not execute')+'.');
    }
  });
  loadScript(['/admin/assets/common.js','/admin/common.js'], 'Admin common', function(){
    loadScript(['/admin/assets/leads.js','/admin/leads.js','/leads.js'], 'Customer Leads', function(){
      if(typeof window.reloadAdminData!=='function')fail('Customer Leads loaded but did not initialize.');
    });
  });
})();
</script></body></html>
