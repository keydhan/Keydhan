<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KeyDhan Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#020814;color:#fff}.dashboard{display:flex;min-height:100vh}.sidebar{width:260px;background:#071323;padding:25px 18px;position:fixed;height:100vh}.logo{font-size:28px;font-weight:800;margin-bottom:35px}.logo span{color:#D4AF37}.sidebar a{display:flex;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:14px;text-decoration:none;color:#fff}.sidebar a.active,.sidebar a:hover{background:#0b1627;color:#D4AF37}.main{margin-left:260px;flex:1;padding:30px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.admin-info{display:flex;gap:15px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#F8E58C,#D4AF37);display:flex;align-items:center;justify-content:center;color:#111;font-weight:800}.logout{background:#ff4d4f;color:#fff;border:none;padding:12px 22px;border-radius:999px;cursor:pointer;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:#071323;border:1px solid rgba(212,175,55,.15);border-radius:22px;padding:22px}.card h2{color:#D4AF37;font-size:34px;margin-top:10px}@media(max-width:900px){.sidebar{left:-260px;transition:.3s}.sidebar.show{left:0}.main{margin-left:0;padding:20px}.menu-btn{display:block;background:#0b1627;color:#D4AF37;border:none;padding:12px 16px;border-radius:12px;font-size:20px;cursor:pointer}}@media(min-width:901px){.menu-btn{display:none}}</style></head>
<body><div class="dashboard"><div class="sidebar" id="sidebar"><div class="logo">Key<span>Dhan</span><sup style="font-size:11px;color:#D4AF37">™</sup></div><a href="#" class="active">🏠 Dashboard</a><a href="properties.html">🏘 Properties</a><a href="leads.html">📧 Leads</a><a href="#">💰 Loan Offers</a><a href="#">📊 Analytics</a><a href="#">⚙ Settings</a><a href="../index.html">🌐 Website</a></div>
<div class="main"><div class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="admin-info"><div class="avatar">KD</div><div><strong>Welcome, Dev</strong><br><small>KeyDhan™ Admin</small></div></div></div><button id="logoutBtn" type="button" class="logout">Logout</button></div>
<div class="stats"><div class="card"><small>Total Leads</small><h2 id="leadCount">248</h2></div><div class="card"><small>Properties</small><h2>32</h2></div><div class="card"><small>Loan Disbursal</small><h2>₹2.8Cr</h2></div><div class="card"><small>Conversion</small><h2>28%</h2></div></div></div></div>
<script>
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("show")}
let c=248;setInterval(()=>{const e=document.getElementById("leadCount");if(e)e.textContent=++c},10000);
// Force absolute Cloudflare logout
document.getElementById("logoutBtn").addEventListener("click",function(e){
 e.preventDefault();e.stopPropagation();window.top.location.replace("https://keydhan.com/cdn-cgi/access/logout");
});
window.addEventListener("pageshow",function(ev){const nav=performance.getEntriesByType("navigation")[0];if(ev.persisted||(nav&&nav.type==="back_forward"))window.location.replace("https://keydhan.com/admin/");});
</script>
<script src="dashboard.js"></script></body></html>
