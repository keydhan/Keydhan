<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>KeyDhan™ Admin - Property Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,sans-serif;background:#06111f;color:#fff}

:root{
--gold:#D4AF37;
--card:#0b1b31;
--bg:#08111d;
}

.wrapper{display:flex;min-height:100vh}

/* Sidebar */

.sidebar{
width:250px;
background:var(--bg);
padding:25px 18px;
border-right:1px solid rgba(212,175,55,.12);
position:fixed;
height:100vh;
overflow:auto;
}

.logo{
font-size:30px;
font-weight:800;
color:var(--gold);
margin-bottom:35px;
}

.menu a{
display:block;
text-decoration:none;
color:#fff;
padding:13px 15px;
border-radius:12px;
margin-bottom:8px;
transition:.2s;
}

.menu a:hover,
.menu a.active{
background:#12223b;
color:var(--gold);
}

/* Main */

.main{
flex:1;
margin-left:250px;
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.logout{
background:#ff4d4f;
border:none;
color:#fff;
padding:11px 18px;
border-radius:999px;
cursor:pointer;
font-weight:700;
}

/* Stats */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:25px;
}

.stat-card{
background:var(--card);
padding:20px;
border-radius:18px;
border:1px solid rgba(212,175,55,.15);
}

.stat-card h4{
color:#b9c4d3;
font-size:14px;
}

.stat-card h2{
color:var(--gold);
margin-top:8px;
font-size:32px;
}

/* Cards */

.card{
background:var(--card);
border:1px solid rgba(212,175,55,.15);
border-radius:22px;
padding:25px;
margin-bottom:30px;
}

.card h2{
color:var(--gold);
margin-bottom:20px;
}

/* Form */

label{
display:block;
margin-bottom:6px;
color:#cdd5df;
font-size:14px;
}

input,textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#13243d;
color:#fff;
margin-bottom:18px;
font-family:Poppins,sans-serif;
}

textarea{
min-height:110px;
resize:vertical;
}

button.save{
background:var(--gold);
color:#111;
padding:14px 24px;
border:none;
border-radius:999px;
font-weight:700;
cursor:pointer;
}

/* Search */

.search-box{
margin-bottom:20px;
}

/* Table */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:720px;
}

th{
color:var(--gold);
text-align:left;
padding:14px;
background:#12223b;
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.06);
vertical-align:middle;
}

.thumb{
width:80px;
height:60px;
object-fit:cover;
border-radius:8px;
background:#13243d;
}

.action-btn{
padding:8px 12px;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
margin-right:6px;
}

.edit{
background:#D4AF37;
color:#111;
}

.delete{
background:#ff4d4f;
color:#fff;
}

.empty{
text-align:center;
padding:30px;
color:#aeb9c7;
}

/* Mobile */

@media(max-width:900px){

.wrapper{
flex-direction:column;
}

.sidebar{
position:relative;
width:100%;
height:auto;
border-right:none;
border-bottom:1px solid rgba(212,175,55,.12);
}

.main{
margin-left:0;
padding:20px;
}

}
</style>
</head>

<body>

<div class="wrapper">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">KeyDhan™</div>

<div class="menu">
<a href="dashboard.html">🏠 Dashboard</a>
<a href="properties.html" class="active">🏘 Properties</a>
<a href="leads.html">📧 Leads</a>
<a href="loan-offers.html">💰 Loan Offers</a>
<a href="analytics.html">📊 Analytics</a>
<a href="settings.html">⚙ Settings</a>
<a href="../index.html">🌐 Website</a>
</div>

</div>

<!-- Main -->

<div class="main">

<div class="top">

<div>
<h1>Property Management</h1>
<p style="color:#9fb0c7">Manage Live Website Properties</p>
</div>

<button class="logout" onclick="logoutAdmin()">Logout</button>

</div>

<!-- Stats -->

<div class="stats">

<div class="stat-card">
<h4>Total Properties</h4>
<h2 id="propertyCount">0</h2>
</div>

<div class="stat-card">
<h4>Live Website</h4>
<h2>Active</h2>
</div>

</div>

<!-- Add Property -->

<div class="card">

<h2>Add / Edit Property</h2>

<label>Property Title</label>
<input id="title" placeholder="3BHK Luxury Apartment">

<label>Location</label>
<input id="location" placeholder="Faridabad">

<label>Price</label>
<input id="price" placeholder="₹65,00,000">

<label>Image URL</label>
<input id="image" placeholder="https://example.com/image.jpg">

<label>Description</label>
<textarea id="desc" placeholder="Property Description"></textarea>

<button id="saveBtn" class="save">Save Property</button>

</div>

<!-- Property List -->

<div class="card">

<h2>Saved Properties</h2>

<div class="search-box">
<input id="searchInput" placeholder="Search Property or Location...">
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Image</th>
<th>Title</th>
<th>Location</th>
<th>Price</th>
<th>Action</th>
</tr>
</thead>

<tbody id="propertyTable">

<tr>
<td colspan="5" class="empty">Loading properties...</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>
function logoutAdmin(){

localStorage.clear();
sessionStorage.clear();

window.location.href="https://keydhan.com/cdn-cgi/access/logout";

}

/* Search */

document.getElementById("searchInput").addEventListener("input",function(){

const value=this.value.toLowerCase();

document.querySelectorAll("#propertyTable tr").forEach(row=>{

const text=row.innerText.toLowerCase();

row.style.display=text.includes(value)?"":"none";

});

});

/* Update Property Count */

const observer=new MutationObserver(()=>{

const rows=document.querySelectorAll("#propertyTable tr");

const count=[...rows].filter(r=>r.querySelector("td")).length;

document.getElementById("propertyCount").innerText=
count===1&&rows[0].innerText.includes("Loading")?0:count;

});

observer.observe(document.getElementById("propertyTable"),{
childList:true
});
</script>

<script src="property-form.js"></script>

</body>
</html>
