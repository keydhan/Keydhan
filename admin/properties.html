<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDhan Admin - Properties</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#081224;
  color:#fff;
}
.container{display:flex;min-height:100vh}
.sidebar{
  width:240px;
  background:#0d1b33;
  padding:20px;
}
.logo{
  font-size:34px;
  font-weight:bold;
  color:#f5c542;
  margin-bottom:30px;
}
.menu a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:12px 14px;
  border-radius:8px;
  margin-bottom:8px;
}
.menu a:hover,
.menu a.active{
  background:#1b4fd8;
}
.main{
  flex:1;
  padding:30px;
}
.card{
  background:#11213d;
  border-radius:16px;
  padding:20px;
}
input,textarea{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:6px;
  margin-bottom:15px;
}
button{
  background:#f5c542;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:25px;
}
th,td{
  border-bottom:1px solid #2b3f67;
  padding:12px;
  text-align:left;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<div class="logo">KeyDhan</div>

<div class="menu">
<a href="dashboard.html">Dashboard</a>
<a href="properties.html" class="active">Properties</a>
<a href="leads.html">Leads</a>
<a href="loan-offers.html">Loan Offers</a>
<a href="analytics.html">Analytics</a>
<a href="settings.html">Settings</a>
<a href="../index.html">Website</a>
</div>
</div>

<div class="main">

<h2>Property Management</h2>
<br>

<div class="card">

<h3>Add New Property</h3>

<input id="title" placeholder="Property Title">
<input id="location" placeholder="Location">
<input id="price" placeholder="Price">
<input id="image" placeholder="Image URL">
<textarea id="desc" placeholder="Description"></textarea>

<button id="saveBtn">Save Property</button>

<table>
<thead>
<tr>
<th>Title</th>
<th>Location</th>
<th>Price</th>
</tr>
</thead>
<tbody id="propertyTable"></tbody>
</table>

</div>
</div>
</div>

<script src="property-form.js"></script>

</body>
</html>
