<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KeyDhan™ Admin - Property Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins,sans-serif;
background:#06111f;
color:#fff;
}

:root{
--gold:#D4AF37;
--card:#0b1b31;
--bg:#08111d;
}

.wrapper{
display:flex;
min-height:100vh;
}

/* Sidebar */

.sidebar{
width:250px;
background:var(--bg);
padding:25px 18px;
border-right:1px solid rgba(212,175,55,.12);
}

.logo{
font-size:30px;
font-weight:800;
color:var(--gold);
margin-bottom:35px;
}

.menu a{
display:block;
text-decoration:none;
color:#fff;
padding:13px 15px;
border-radius:12px;
margin-bottom:8px;
transition:.2s;
}

.menu a:hover,
.menu a.active{
background:#12223b;
color:var(--gold);
}

/* Main */

.main{
flex:1;
padding:30px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.logout{
background:#ff4d4f;
border:none;
color:#fff;
padding:11px 18px;
border-radius:999px;
cursor:pointer;
font-weight:700;
}

/* Form */

.card{
background:var(--card);
border:1px solid rgba(212,175,55,.15);
border-radius:22px;
padding:25px;
margin-bottom:30px;
}

.card h2{
color:var(--gold);
margin-bottom:20px;
}

label{
display:block;
margin-bottom:6px;
color:#cdd5df;
}

input,textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#13243d;
color:#fff;
margin-bottom:18px;
font-family:Poppins,sans-serif;
}

textarea{
min-height:110px;
resize:vertical;
}

button.save{
background:var(--gold);
color:#111;
padding:14px 24px;
border:none;
border-radius:999px;
font-weight:700;
cursor:pointer;
}

/* Table */

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
color:var(--gold);
text-align:left;
padding:14px;
background:#12223b;
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.06);
}

img.thumb{
width:80px;
height:60px;
object-fit:cover;
border-radius:8px;
}

.empty{
text-align:center;
padding:30px;
color:#aeb9c7;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="sidebar">

<div class="logo">KeyDhan™</div>

<div class="menu">
<a href="dashboard.html">🏠 Dashboard</a>
<a href="properties.html" class="active">🏘 Properties</a>
<a href="leads.html">📧 Leads</a>
<a href="loan-offers.html">💰 Loan Offers</a>
<a href="analytics.html">📊 Analytics</a>
<a href="settings.html">⚙ Settings</a>
<a href="../index.html">🌐 Website</a>
</div>

</div>

<div class="main">

<div class="top">
<h1>Property Management</h1>
<button class="logout" onclick="window.location.href='https://keydhan.com/cdn-cgi/access/logout'">Logout</button>
</div>

<div class="card">

<h2>Add New Property</h2>

<label>Property Title</label>
<input id="title" placeholder="3BHK Luxury Apartment">

<label>Location</label>
<input id="location" placeholder="Faridabad">

<label>Price</label>
<input id="price" placeholder="₹65,00,000">

<label>Image URL</label>
<input id="image" placeholder="https://...">

<label>Description</label>
<textarea id="desc" placeholder="Property Description"></textarea>

<button id="saveBtn" class="save">Save Property</button>

</div>

<div class="card">

<h2>Saved Properties</h2>

<table>

<thead>
<tr>
<th>Image</th>
<th>Title</th>
<th>Location</th>
<th>Price</th>
</tr>
</thead>

<tbody id="propertyTable">
<tr>
<td colspan="4" class="empty">Loading properties...</td>
</tr>
</tbody>

</table>

</div>

</div>

</div>

<script src="property-form.js"></script>

</body>
</html>
