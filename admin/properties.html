<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeyDhan™ | Properties</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,sans-serif;
  background:#06111f;
  color:#fff;
}
:root{
  --gold:#D4AF37;
  --card:#0b1b31;
}

header{
  padding:25px;
  text-align:center;
  background:#071323;
  border-bottom:1px solid rgba(212,175,55,.15);
}
header h1{
  color:var(--gold);
  font-size:34px;
}
header p{
  color:#b8c2d3;
  margin-top:8px;
}

.container{
  max-width:1280px;
  margin:auto;
  padding:35px 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:24px;
}

.card{
  background:var(--card);
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(212,175,55,.15);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
}

.image{
  width:100%;
  height:230px;
  object-fit:cover;
  background:#14253e;
}

.content{
  padding:20px;
}

.title{
  font-size:22px;
  font-weight:700;
}

.location{
  margin-top:8px;
  color:#b8c2d3;
}

.price{
  margin-top:15px;
  color:var(--gold);
  font-size:28px;
  font-weight:800;
}

.desc{
  margin-top:12px;
  color:#d4d8df;
  line-height:1.6;
}

.btn{
  display:inline-block;
  margin-top:20px;
  background:var(--gold);
  color:#111;
  text-decoration:none;
  padding:12px 22px;
  border-radius:999px;
  font-weight:700;
}

.loading{
  text-align:center;
  color:#b8c2d3;
  padding:60px;
  font-size:18px;
}

.empty{
  text-align:center;
  padding:80px 20px;
}

.empty h2{
  color:var(--gold);
  margin-bottom:12px;
}
</style>
</head>

<body>

<header>
  <h1>KeyDhan™ Properties</h1>
  <p>Verified Property Listings • Live from Admin Panel</p>
</header>

<div class="container">

  <div id="loading" class="loading">
    Loading Properties...
  </div>

  <div id="propertyGrid" class="grid"></div>

</div>

<script>
const API="https://admin-api.keydhan.com/api/properties";

async function loadProperties(){

  const grid=document.getElementById("propertyGrid");
  const loading=document.getElementById("loading");

  try{

    const res=await fetch(API);
    const data=await res.json();

    loading.style.display="none";

    if(!Array.isArray(data)||data.length===0){

      grid.innerHTML=`
        <div class="empty">
          <h2>No Properties Available</h2>
          <p>New listings will appear automatically.</p>
        </div>`;
      return;
    }

    grid.innerHTML="";

    data.forEach(p=>{

      const img=p.image && p.image.trim()!=="" ? p.image :
      "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=900";

      grid.innerHTML+=`
        <div class="card">

          <img class="image" src="${img}" alt="${p.title}">

          <div class="content">

            <div class="title">${p.title||"Property"}</div>

            <div class="location">📍 ${p.location||"-"}</div>

            <div class="price">${p.price||"-"}</div>

            <div class="desc">${p.desc||""}</div>

            <a href="contact.html" class="btn">Enquire Now</a>

          </div>

        </div>`;
    });

  }catch(err){

    loading.innerHTML="Unable to load properties.";

    console.error(err);

  }

}

document.addEventListener("DOMContentLoaded",loadProperties);
</script>

</body>
</html>
