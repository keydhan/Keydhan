<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse KeyDhan properties and real estate listings."><title>Properties | KeyDhan</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--gold:#D4AF37}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;background:#020814;color:white}header{padding:25px;text-align:center;font-size:34px;font-weight:800;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;padding:24px}.card{background:#071323;border-radius:18px;overflow:hidden;border:1px solid rgba(212,175,55,.18)}.card img{width:100%;height:220px;object-fit:cover}.content{padding:20px}.title{font-size:22px;font-weight:700;color:var(--gold)}.price{font-size:21px;font-weight:700;margin-top:10px}.location{color:#cbd5e1;margin-top:6px}.desc{margin-top:12px;color:#94a3b8}.btn{display:block;margin-top:20px;text-align:center;background:var(--gold);color:#111;padding:12px;text-decoration:none;border-radius:999px;font-weight:700}.badge{display:inline-block;background:var(--gold);color:#111;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:12px}.status{text-align:center;color:#a9b5c5;padding:15px}</style></head><body><header id="pageTitle">Featured Properties</header><div id="status" class="status">Loading properties…</div><div class="grid" id="propertyGrid"></div><script>const API="https://admin-api.keydhan.com/api";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function loadProperties(){const grid=document.getElementById("propertyGrid"),status=document.getElementById("status");try{const [r,c]=await Promise.all([fetch(API+"/properties",{cache:"no-store"}),fetch(API+"/content",{cache:"no-store"})]);if(!r.ok)throw Error("Property API returned HTTP "+r.status);const data=await r.json(),content=c.ok?(await c.json()).content||{}:{};if(content.propertiesTitle)document.getElementById("pageTitle").textContent=content.propertiesTitle;const list=Array.isArray(data.properties)?data.properties:[];status.textContent=list.length?list.length+" properties available":"No properties published yet.";grid.innerHTML=list.map(p=>'<article class="card"><img src="'+esc(p.image||"https://placehold.co/600x400?text=Property")+'" alt="'+esc(p.title)+'" onerror="this.src=\'https://placehold.co/600x400?text=Property\'"><div class="content"><div class="title">'+esc(p.title)+'</div><div class="price">'+esc(p.price)+'</div><div class="location">'+esc(p.location)+' · '+esc(p.bedrooms||"")+' BHK</div><div class="desc">'+esc(p.description||p.desc||"")+'</div>'+(p.featured?'<span class="badge">Featured</span>':'')+'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+esc(p.whatsapp||"919999999999")+'?text='+encodeURIComponent("I am interested in "+p.title+" ("+p.price+")")+'">Enquire Now</a></div></article>').join("")}catch(e){status.textContent="Unable to load properties. Please try again later.";console.error(e)}}loadProperties();</script></body></html>
