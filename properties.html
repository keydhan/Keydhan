<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>KeyDhan Properties</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap' rel='stylesheet'><style>body{margin:0;font-family:Poppins,sans-serif;background:#020814;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:30px}.card{background:#071323;border-radius:20px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.content{padding:18px}.btn{display:block;background:#D4AF37;color:#111;text-align:center;padding:12px;border-radius:999px;text-decoration:none;font-weight:700}</style></head><body><h1 style='text-align:center;color:#D4AF37'>Featured Properties</h1><div class='grid' id='grid'></div><script>fetch('data/properties.json').then(r=>r.json()).then(list=>{grid.innerHTML=list.map(p=>`<div class='card'><img src='${p.image}' onerror="this.src='https://via.placeholder.com/600x400?text=Property'"><div class='content'><h2 style='color:#D4AF37'>${p.title}</h2><h3>${p.price}</h3><p>${p.location} • ${p.bhk}</p><p>${p.description}</p><a class='btn' href='https://wa.me/919999999999?text='+encodeURIComponent('I am interested in '+p.title) target='_blank'>Enquire Now</a></div></div>`).join('')}).catch(()=>grid.innerHTML='<h2>Unable to load properties.</h2>')</script></body></html>
